spring:
  application:
    name: ccps-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ccps_property_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:1GB}
      max-request-size: ${MAX_REQUEST_SIZE:1GB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

ccps:
  backup:
    root: ${BACKUP_STORAGE_ROOT:backups}
    mysqldump-command: ${MYSQLDUMP_COMMAND:mysqldump}
    mysql-command: ${MYSQL_COMMAND:mysql}
  reminders:
    cron: ${REMINDER_CRON:0 0 * * * *}
  rent-collection:
    cron: ${RENT_COLLECTION_CRON:0 5 * * * *}
  financial-notifications:
    cron: ${FINANCIAL_NOTIFICATION_CRON:0 15 * * * *}
  reserve-target:
    cron: ${RESERVE_TARGET_CRON:0 10 * * * *}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    sender-name: ${MAIL_SENDER_NAME:CCPS 家慶佳業}
  storage:
    payment-proofs: ${PAYMENT_PROOF_STORAGE:uploads/payment-proofs}
    maintenance-attachments: ${MAINTENANCE_ATTACHMENT_STORAGE:uploads/maintenance-attachments}
    reserve-topups: ${RESERVE_TOPUP_STORAGE:uploads/reserve-topups}
    document-root: ${DOCUMENT_STORAGE_ROOT:uploads}
    lease-contracts: ${LEASE_CONTRACT_STORAGE:uploads/lease-contracts}
    accounting-exports: ${ACCOUNTING_EXPORT_STORAGE:uploads/accounting-exports}
    reports: ${REPORT_STORAGE_ROOT:uploads/reports}
    property-contracts: ${PROPERTY_CONTRACT_STORAGE:uploads/property-contracts}
    property-photos: ${PROPERTY_PHOTO_STORAGE:uploads/property-photos}
    property-attachments: ${PROPERTY_ATTACHMENT_STORAGE:uploads/property-attachments}
    property-handover-reports: ${PROPERTY_HANDOVER_REPORT_STORAGE:uploads/property-handover-reports}
    property-cashflow: ${PROPERTY_CASHFLOW_STORAGE:uploads/property-cashflow}
    electronic-signatures: ${ELECTRONIC_SIGNATURE_STORAGE:uploads/electronic-signatures}
  signing:
    frontend-base: ${SIGNING_FRONTEND_BASE:http://localhost:5173}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v26.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:60}
    proxy-url: ${WHATSAPP_PROXY_URL:${HTTPS_PROXY:${HTTP_PROXY:}}}
    delivery-initial-delay-ms: ${WHATSAPP_DELIVERY_INITIAL_DELAY_MS:15000}
    delivery-delay-ms: ${WHATSAPP_DELIVERY_DELAY_MS:15000}
    templates:
      language: ${WHATSAPP_TEMPLATE_LANGUAGE:zh_CN}
      first-reminder: ${WHATSAPP_TEMPLATE_FIRST_REMINDER:ccps_rent_collection_notice}
      second-reminder: ${WHATSAPP_TEMPLATE_SECOND_REMINDER:ccps_rent_collection_notice}
      final-reminder: ${WHATSAPP_TEMPLATE_FINAL_REMINDER:ccps_rent_collection_notice}
      termination-notice: ${WHATSAPP_TEMPLATE_TERMINATION_NOTICE:ccps_rent_collection_notice}
      lease-expiry-business: ${WHATSAPP_TEMPLATE_LEASE_EXPIRY_BUSINESS:ccps_lease_expiry_business_notice}
    webhook:
      verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      app-secret: ${META_APP_SECRET:}

server:
  port: 8080

logging:
  level:
    com.ccps.backend: INFO
